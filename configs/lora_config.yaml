model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  load_in_4bit: false

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  fp16: false
  bf16: true
  max_seq_length: 2048
  output_dir: "./outputs/lora"

logging:
  wandb_project: "aerosense-chartqa"
  mlflow_experiment: "lora-finetune"
  log_steps: 10
